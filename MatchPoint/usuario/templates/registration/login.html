
{% load static %}
<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/css/bootstrap.min.css" rel="stylesheet">

    <title>Login - MatchPoint</title>

    <style>
        body {
            background-color: #0e0c0c;
            color: white;
            font-family: Arial, sans-serif;
            margin: 0;
        }

        .centro {
            text-align: center;
            margin-top: 100px;
            padding: 20px;
        }

        .cartao {
            width: 450px;
            max-width: 90%;
            margin: 35px auto;
            padding: 30px;
            border: 5px solid #a6ff00;
            border-radius: 30px;
            background-color: #171515;
            box-shadow: 0 0 20px rgba(166, 255, 0, 0.18);
            text-align: left;
            transition: 0.3s;
        }

        .cartao:hover {
            box-shadow: 0 0 28px rgba(166, 255, 0, 0.3);
        }


        h1 {
            font-size: 38px;
            color: #a6ff00;
            margin-bottom: 35px;
            font-weight: bold;
        }

        h2 {
            font-size: 36px;
            margin-bottom: 25px;
            text-align: center;
            color: #ff45b5;
        }
        form p {
            margin-bottom: 20px;
        }

        form label {
            display: block;
            margin-bottom: 8px;
        }

        form input {
            width: 100%;
            padding: 12px;
            box-sizing: border-box;
            border: none;
            border-radius: 25px;
            background-color: #2c2c2c;
            color: white;
        }

        button {
            width: 100%;
            padding: 12px;
            border: 2px solid #ff45b5;
            border-radius: 25px;
            background-color: #ff45b5;
            color: #0e0c0c;
            font-weight: bold;
            cursor: pointer;
            transition: 0.2s;
        }

        button:hover {
            background-color: transparent;
            color: #ff45b5;
        }

        .cadastro {
            text-align: center;
            margin-top: 25px;
        }

        .cadastro a {
            color: #a6ff00;
            text-decoration: none;
        }

        .cadastro a:hover {
            color: #ff45b5;
        }

        .errorlist {
            color: #8B4222;
        }
    </style>
</head>

<body>
    <main class="centro">
        <h1>Bem-Vindo! Bora Jogar?</h1>

        <div class="cartao">
            <h2>Entrar</h2>

            <form method="post">
                {% csrf_token %}

                {% if erro %}
                    <p style="color: #ff45b5; text-align: center;">
                        {{ erro }}
                    </p>
                {% endif %}

                <label for="email">E-mail</label>
                <input
                    type="email"
                    id="email"
                    name="email"
                    placeholder="Digite seu e-mail"
                    required
                >

                <label for="senha" style="margin-top: 20px;">Senha</label>
                <input
                    type="password"
                    id="senha"
                    name="senha"
                    placeholder="Digite sua senha"
                    required
                >

                <button type="submit" style="margin-top: 25px;">
                    Entrar
                </button>
            </form>

            <div class="cadastro">
                ainda não tem conta?
                <a href="{% url 'cadastro' %}">criar agora</a>
            </div>
        </div>
    </main>
</body>
</html>
