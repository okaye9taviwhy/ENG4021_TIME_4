{% load static %}
<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Trocar senha</title>
    <link rel="stylesheet" href="{% static 'estilo.css' %}">
    <link rel="stylesheet" href="{% static 'senha.css' %}">
</head>
<body>
    <main class="centro">
        <h1 class="titulo">Trocar senha</h1>

        <form class="cartao cartao-senha" method="post">
            {% csrf_token %}

            {{ form.as_p }}

            <button type="submit" class="botao">Alterar senha</button>

            <p class="rodape">
                <a class="link" href="/">Voltar à página inicial</a>
            </p>
        </form>
    </main>
</body>
</html>
