{% load static %}
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Editar perfil - MatchPoint</title>
    <link rel="stylesheet" href="{% static 'estilo.css' %}">
</head>

<body>

    <a href="{% url 'admin:login' %}" class="inicio">← Voltar</a>

    <main class="centro">
        <h1 class="titulo">MatchPoint</h1>

        <form class="cartao" action="{% url 'editar_usuario' %}" method="post">
            {% csrf_token %}

            <h2>Editar perfil</h2>

            <p class="texto">
                Atualize suas informações no MatchPoint.
            </p>
            {% if messages %}
                {% for message in messages %}
                    <p class="texto">{{ message }}</p>
                {% endfor %}
            {% endif %}

            <div class="campo">
                <label for="nome">Nome completo</label>
                <input
                    type="text"
                    id="nome"
                    name="nome"
                    value="{{ usuario.get_full_name }}"
                    placeholder="Digite seu nome"
                    autocomplete="name"
                    required
                >
            </div>

            <div class="campo">
                <label for="email">E-mail</label>
                <input
                    type="email"
                    id="email"
                    name="email"
                    value="{{ usuario.email }}"
                    placeholder="Digite seu e-mail"
                    autocomplete="email"
                    required
                >
            </div>

            <div class="campo">
                <label for="foto">Foto de perfil (URL)</label>
                <input
                    type="url"
                    id="foto"
                    name="foto"
                    value="{{ foto|default:'' }}"
                    placeholder="https://exemplo.com/foto.jpg"
                >
            </div>

            <div class="campo">
                <label for="senha">Nova senha</label>
                <input
                    type="password"
                    id="senha"
                    name="senha"
                    placeholder="Deixe vazio para manter a atual"
                    autocomplete="new-password"
                >
            </div>

            <div class="botoes">
                <button type="submit" class="botao">
                    Salvar alterações
                </button>

                <a href="{% url 'admin:login' %}" class="botao botao-cancelar">
                     Cancelar
                </a>
            </div>
        </form>
    </main>

</body>
</html>
