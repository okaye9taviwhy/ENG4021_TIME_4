<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MatchPoint - Remover usuário</title>
    <link rel="stylesheet" href="estilo.css">
</head>
<body>
    <a class="inicio" href="#">Início</a>

    <main class="centro">
        <h1 class="titulo">Remover usuário</h1>

        <form class="cartao" method="post">
            <h2>Tem certeza?</h2>
            <p class="texto">Ao remover o usuário, todos os dados dele serão apagados. Essa ação não pode ser desfeita.</p>

            <div class="botoes">
                <a class="botao botao-cancelar" href="login.html">Cancelar</a>
                <button type="submit" class="botao botao-remover">Remover</button>
            </div>
        </form>
    </main>
</body>
</html>
