<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>MatchPoint - Cadastro</title>
    <style>
        body {
            font-family: Arial;
            background-color: #f2f2f2;
        }
        .caixa {
            width: 300px;
            margin: 50px auto;
            padding: 20px;
            background-color: white;
            border-radius: 10px;
        }
        h1 {
            color: #ff6600;
            text-align: center;
        }
        label {
            display: block;
            margin-top: 10px;
        }
        input, select {
            width: 95%;
            padding: 8px;
            margin-top: 5px;
        }
        button {
            width: 100%;
            margin-top: 20px;
            padding: 10px;
            background-color: #ff6600;
            color: white;
            border: none;
            border-radius: 5px;
        }
    </style>
</head>
<body>
    <div class="caixa">
        <h1>MatchPoint</h1>
        <h2>Cadastro</h2>

        <form method="post">
            {% csrf_token %}

            <label>Nome:</label>
            <input type="text" name="nome">

            <label>E-mail:</label>
            <input type="email" name="email">

            <label>Senha:</label>
            <input type="password" name="senha">

            <label>Esporte favorito:</label>
            <select name="esporte">
                <option>Vôlei de praia</option>
                <option>Beach tennis</option>
            </select>

            <button type="submit">Cadastrar</button>
        </form>

        <p><a href="/usuarios/">Ver lista de usuários</a></p>
    </div>
</body>
</html>
