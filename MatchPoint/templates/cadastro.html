
{% load static %}
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MatchPoint - Cadastro</title>
    <link rel="stylesheet" href="{% static 'estilo.css' %}">
</head>
<body>
    <a class="inicio" href="{% url 'login' %}">← Voltar ao login</a>

    <main class="centro">
        <h1 class="titulo">MatchPoint</h1>

        <form class="cartao" method="post" action="{% url 'cadastro' %}">
            {% csrf_token %}

            <h2>Criar conta</h2>
            <p class="texto">Encontre pessoas para praticar seu esporte favorito.</p>

            {% if erro %}
                <p class="texto">{{ erro }}</p>
            {% endif %}

            <div class="campo">
                <label for="nome">Nome completo</label>
                <input type="text" id="nome" name="nome"
                       autocomplete="name" required>
            </div>

            <div class="campo">
                <label for="email">E-mail</label>
                <input type="email" id="email" name="email"
                       autocomplete="email" required>
            </div>

            <div class="campo">
                <label for="senha">Senha</label>
                <input type="password" id="senha" name="senha"
                       autocomplete="new-password" required>
            </div>

            <div class="campo">
                <label for="confirmar_senha">Confirmar senha</label>
                <input type="password" id="confirmar_senha"
                       name="confirmar_senha"
                       autocomplete="new-password" required>
            </div>

            <div class="botoes">
                <button type="submit" class="botao">Criar conta</button>
                <a href="{% url 'login' %}"
                   class="botao botao-cancelar">Já tenho uma conta</a>
            </div>
        </form>
    </main>
</body>
</html>
