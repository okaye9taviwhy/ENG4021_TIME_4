
{% load static %}
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MatchPoint - Entrar</title>
    <link rel="stylesheet" href="{% static 'estilo.css' %}">
</head>
<body>
    <a class="inicio" href="{% url 'login' %}">Início</a>

    <main class="centro">
        <h1 class="titulo">Bem-Vindo! Bora Jogar?</h1>

        <form class="cartao" method="post" action="{% url 'login' %}">
            {% csrf_token %}
            <h2>Entrar</h2>

            {% if erro %}
                <p class="texto">{{ erro }}</p>
            {% endif %}

            <div class="campo">
                <label for="email">E-mail</label>
                <input type="email" id="email" name="email" required>
            </div>

            <div class="campo">
                <label for="senha">Senha</label>
                <input type="password" id="senha" name="senha" required>
            </div>

            <button type="submit" class="botao">Entrar</button>

            <p class="rodape">
                Ainda não tem conta?
                <a class="link" href="#">Criar agora</a>
            </p>
        </form>
    </main>
</body>
</html>
